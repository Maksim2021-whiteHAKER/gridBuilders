name: CI

# Запускать пайплайн при push и pull request в ветки main или master
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Получение кода из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Установка Node.js и кэширование зависимостей (ускоряет следующие запуски)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Используем актуальную LTS версию
          cache: 'npm'

      # 3. Установка зависимостей (npm ci быстрее и надежнее npm install для CI)
      - name: Install dependencies
        run: npm ci

      # 4. Проверка кода линтером (ESLint)
      - name: Run linter
        run: npm run lint

      # 5. Проверка типов TypeScript (критически важно для TS проектов)
      - name: Type check
        run: npx tsc --noEmit

      # 6. Запуск тестов (используем test:run, чтобы vitest не зависал в watch-режиме)
      - name: Run tests
        run: npm run test:run

      # 7. Сборка проекта (проверяем, что билд вообще проходит)
      - name: Build project
        run: npm run build